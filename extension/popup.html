<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header><h1>Save to MBA Recruiting Tool</h1></header>
    <main>
    <p id="message" hidden></p>

    <form id="form" hidden>
      <label>Name <input id="full_name" required /></label>
      <label>Title <input id="title" /></label>
      <label>Company <input id="company" /></label>
      <label>How you met <input id="how_met" placeholder="e.g. BYU alum, intro from Sam" /></label>
      <label>First note <textarea id="note" rows="3"></textarea></label>
      <div class="row">
        <label class="grow">Action item <input id="action_title" placeholder="e.g. Send a thank-you" /></label>
        <label>Due <input id="action_due" type="date" /></label>
      </div>
      <button id="save" type="submit">Save contact</button>
    </form>

    <section id="message-section" hidden>
      <h2>Message</h2>
      <textarea id="message-text" rows="8"></textarea>
      <div class="row spread">
        <small id="count"></small>
        <button id="copy" type="button">Copy message</button>
      </div>
      <small id="name-hint" hidden>Add your name on the extension page so it fills in {my_name}.</small>
      <a id="edit-template" target="_blank">Edit template</a>
    </section>

    <small id="debug" hidden></small>
    <a id="link" target="_blank" hidden></a>
    </main>
    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
